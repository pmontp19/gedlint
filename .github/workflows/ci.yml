name: CI
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Coverage (floor 84% regions)
        run: |
          cargo llvm-cov --summary-only --all-targets 2>/dev/null | tee /tmp/cov.txt
          COV=$(awk '/^TOTAL/ {print $4}' /tmp/cov.txt)
          echo "regions coverage: $COV"
          awk -v cov="$COV" 'BEGIN { c = cov + 0; if (c < 84) { printf "FAIL: %s below 84%%\n", cov; exit 1 } }'
      - name: WASM check
        run: cargo check --target wasm32-unknown-unknown
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
          # No Intel-mac runner: GitHub retired macos-13 queues (stalls for hours).
          # Intel Macs: cargo install --git github.com/pmontp19/gedlint.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          STAGE="gedlint-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/gedlint${{ matrix.ext }}" "$STAGE/"
          cp README.md AGENTS.md "$STAGE/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$STAGE.zip" "$STAGE"
          else
            tar czf "$STAGE.tar.gz" "$STAGE"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: gedlint-*
