name: CI
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
jobs:
  action-smoke:
    # Exercises action.yml end to end (download pinned dev binary, globs,
    # annotations, summary, outputs, fail-on matrix) on every prebuilt target.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Fixtures
        shell: bash
        run: |
          mkdir -p smoke/nested
          printf '0 HEAD\n1 GEDC\n2 VERS 5.5.1\n0 @I1@ INDI\n1 NAME A /B/\n0 TRLR\n' > smoke/clean.ged
          printf '0 HEAD\n1 GEDC\n2 VERS 5.5.1\n0 @I1@ INDI\n1 NAME A /B/\n1 SEX Q\n0 TRLR\n' > smoke/warn.ged
          printf '0 HEAD\n1 GEDC\n2 VERS 5.5.1\n0 @I1@ INDI\n1 NAME A /B/\n1 FAMC @F9@\n0 TRLR\n' > smoke/nested/broken.ged
      - name: Clean file passes
        uses: ./
        with:
          path: smoke/clean.ged
          version: v1
      - name: Warning ignored with fail-on error
        id: warn-ignored
        uses: ./
        with:
          path: smoke/warn.ged
          fail-on: error
          version: v1
      - name: Warning fails with fail-on warning
        id: warn
        continue-on-error: true
        uses: ./
        with:
          path: smoke/warn.ged
          fail-on: warning
          version: v1
      - name: Glob over several clean and warning files
        id: glob
        uses: ./
        with:
          path: |
            smoke/clean.ged
            smoke/warn.ged
          version: v1
      - name: One bad file in a glob fails the whole step
        id: glob-broken
        continue-on-error: true
        uses: ./
        with:
          path: |
            smoke/*.ged
            smoke/nested/*.ged
          version: v1
      - name: Assert outcomes and outputs
        shell: bash
        env:
          WARN_OUTCOME: ${{ steps.warn.outcome }}
          GLOB_BROKEN_OUTCOME: ${{ steps.glob-broken.outcome }}
          WARN_IGNORED_WARNINGS: ${{ steps.warn-ignored.outputs.warnings }}
          WARN_IGNORED_ERRORS: ${{ steps.warn-ignored.outputs.errors }}
          WARN_IGNORED_FILES: ${{ steps.warn-ignored.outputs.files }}
          WARN_IGNORED_EXIT: ${{ steps.warn-ignored.outputs.exit-code }}
          GLOB_FILES: ${{ steps.glob.outputs.files }}
          GLOB_ERRORS: ${{ steps.glob.outputs.errors }}
          GLOB_WARNINGS: ${{ steps.glob.outputs.warnings }}
          GLOB_EXIT: ${{ steps.glob.outputs.exit-code }}
        run: |
          set -euo pipefail
          assert() { [ "$2" = "$3" ] || { echo "FAIL $1: expected $3, got $2"; exit 1; }; }
          assert "warn outcome" "$WARN_OUTCOME" failure
          assert "glob-broken outcome" "$GLOB_BROKEN_OUTCOME" failure
          assert "warn-ignored errors" "$WARN_IGNORED_ERRORS" 0
          assert "warn-ignored warnings" "$WARN_IGNORED_WARNINGS" 1
          assert "warn-ignored files" "$WARN_IGNORED_FILES" 1
          assert "warn-ignored exit-code" "$WARN_IGNORED_EXIT" 1
          assert "glob files" "$GLOB_FILES" 2
          assert "glob errors" "$GLOB_ERRORS" 0
          assert "glob warnings" "$GLOB_WARNINGS" 1
          assert "glob exit-code" "$GLOB_EXIT" 1
          # Summary content is asserted in the ci job: GITHUB_STEP_SUMMARY is a
          # fresh file per step, so a later step cannot read what the action wrote.
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Coverage (floor 84% regions)
        run: |
          cargo llvm-cov --summary-only --all-targets 2>/dev/null | tee /tmp/cov.txt
          COV=$(awk '/^TOTAL/ {print $4}' /tmp/cov.txt)
          echo "regions coverage: $COV"
          awk -v cov="$COV" 'BEGIN { c = cov + 0; if (c < 84) { printf "FAIL: %s below 84%%\n", cov; exit 1 } }'
      - name: WASM check
        run: cargo check --target wasm32-unknown-unknown
      - name: Report renderer (annotation escaping, grouping, outputs)
        run: |
          set -euo pipefail
          R=$(mktemp -d)
          printf '%s' 'a.ged' > "$R/0000.path"
          printf '%s' 2 > "$R/0000.exit"
          # Message carries every character a workflow command has to escape.
          printf '%s' '{"version":"5.5.1","lines":9,"individuals":1,"families":0,"summary":{"errors":1,"warnings":1,"infos":0},"diagnostics":[{"code":"E008","category":"correctness","severity":"ERROR","line":7,"message":"100% off: a,b\nsecond line"},{"code":"W305","category":"suspicious","severity":"WARN","line":8,"message":"invalid SEX"}]}' > "$R/0000.json"
          OUT=$(GITHUB_STEP_SUMMARY=$R/summary.md GITHUB_OUTPUT=$R/out.txt GITHUB_WORKSPACE= node scripts/gh-report.js "$R")
          grep -qF '::error file=a.ged,line=7,title=gedlint E008 (correctness)::100%25 off: a,b%0Asecond line' <<<"$OUT"
          grep -qF '::warning file=a.ged,line=8,' <<<"$OUT"
          grep -qF '::group::' <<<"$OUT"
          grep -qF 'errors=1' "$R/out.txt"
          grep -qF 'warnings=1' "$R/out.txt"
          grep -qF 'exit-code=2' "$R/out.txt"
          grep -qF '| `E008` | error | correctness | 1 |' "$R/summary.md"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
          # No Intel-mac runner: GitHub retired macos-13 queues (stalls for hours).
          # Intel Macs: cargo install --git github.com/pmontp19/gedlint.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          STAGE="gedlint-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/gedlint${{ matrix.ext }}" "$STAGE/"
          cp README.md AGENTS.md LICENSE "$STAGE/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$STAGE.zip" "$STAGE"
          else
            tar czf "$STAGE.tar.gz" "$STAGE"
          fi
          # action.yml verifies this before unpacking.
          ARCHIVE="$STAGE.${{ matrix.archive }}"
          if command -v sha256sum >/dev/null; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: gedlint-*
