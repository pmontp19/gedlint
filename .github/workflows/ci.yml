name: CI
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
jobs:
  action-smoke:
    # Exercises action.yml end to end (download pinned dev binary, fail-on matrix).
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Fixtures
        shell: bash
        run: |
          printf '0 HEAD\n1 GEDC\n2 VERS 5.5.1\n0 @I1@ INDI\n1 NAME A /B/\n0 TRLR\n' > /tmp/clean.ged
          printf '0 HEAD\n1 GEDC\n2 VERS 5.5.1\n0 @I1@ INDI\n1 NAME A /B/\n1 SEX Q\n0 TRLR\n' > /tmp/warn.ged
      - name: Clean file passes
        uses: ./
        with:
          path: /tmp/clean.ged
          version: v0.5.0
      - name: Warning ignored with fail-on error
        uses: ./
        with:
          path: /tmp/warn.ged
          fail-on: error
          version: v0.5.0
      - name: Warning fails with fail-on warning
        id: warn
        continue-on-error: true
        uses: ./
        with:
          path: /tmp/warn.ged
          fail-on: warning
          version: v0.5.0
      - name: Assert warning failed as expected
        shell: bash
        run: |
          [ "${{ steps.warn.outcome }}" = "failure" ] || { echo "expected failure, got ${{ steps.warn.outcome }}"; exit 1; }
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Coverage (floor 84% regions)
        run: |
          cargo llvm-cov --summary-only --all-targets 2>/dev/null | tee /tmp/cov.txt
          COV=$(awk '/^TOTAL/ {print $4}' /tmp/cov.txt)
          echo "regions coverage: $COV"
          awk -v cov="$COV" 'BEGIN { c = cov + 0; if (c < 84) { printf "FAIL: %s below 84%%\n", cov; exit 1 } }'
      - name: WASM check
        run: cargo check --target wasm32-unknown-unknown
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
          # No Intel-mac runner: GitHub retired macos-13 queues (stalls for hours).
          # Intel Macs: cargo install --git github.com/pmontp19/gedlint.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          STAGE="gedlint-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/gedlint${{ matrix.ext }}" "$STAGE/"
          cp README.md AGENTS.md "$STAGE/"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "$STAGE.zip" "$STAGE"
          else
            tar czf "$STAGE.tar.gz" "$STAGE"
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: gedlint-*
